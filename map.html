<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایش نقشه در مدال</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- فونت Vazir -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
    
    <style>
        body {
            font-family: Vazir, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 50px 20px;
            direction: rtl;
        }
        
        .page-title {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .buttons-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .location-btn {
            background: white;
            border: none;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }
        
        .location-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
        }
        
        .location-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }
        
        .location-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .location-desc {
            color: #7f8c8d;
            font-size: 1rem;
        }
        
        /* استایل مدال */
        .modal-header {
            background: #1abc9c;
            color: white;
        }
        
        .modal-title {
            font-weight: bold;
        }
        
        /* استایل نقشه */
        #mapModal .modal-body {
            padding: 0;
            height: 500px;
            position: relative;
        }
        
        #map {
            height: 100%;
            width: 100%;
            border-radius: 0 0 0.375rem 0.375rem;
        }
        
        /* ریسپانسیو */
        @media (max-width: 768px) {
            .buttons-container {
                grid-template-columns: 1fr;
            }
            
            #mapModal .modal-body {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">📍 نمایش موقعیت‌های مختلف روی نقشه</h1>
        
        <div class="buttons-container">
            <!-- دکمه‌های موقعیت‌های مختلف -->
            <button class="location-btn" data-bs-toggle="modal" data-bs-target="#mapModal" 
                    data-location="تهران" data-lat="35.6892" data-lng="51.3890">
                <span class="location-icon">🏢</span>
                <div class="location-title">دفتر مرکزی تهران</div>
                <div class="location-desc">خیابان ولیعصر، پلاک ۱۰۰</div>
            </button>
            
            <button class="location-btn" data-bs-toggle="modal" data-bs-target="#mapModal" 
                    data-location="مشهد" data-lat="36.2605" data-lng="59.6168">
                <span class="location-icon">🕌</span>
                <div class="location-title">شعبه مشهد</div>
                <div class="location-desc">بلوار وکیل آباد، مجتمع تجاری</div>
            </button>
            
            <button class="location-btn" data-bs-toggle="modal" data-bs-target="#mapModal" 
                    data-location="اصفهان" data-lat="32.6546" data-lng="51.6680">
                <span class="location-icon">🏛️</span>
                <div class="location-title">شعبه اصفهان</div>
                <div class="location-desc">خیابان چهارباغ، جنب پل خواجو</div>
            </button>
            
            <button class="location-btn" data-bs-toggle="modal" data-bs-target="#mapModal" 
                    data-location="شیراز" data-lat="29.5918" data-lng="52.5837">
                <span class="location-icon">🌹</span>
                <div class="location-title">شعبه شیراز</div>
                <div class="location-desc">بلوار زرگری، مرکز خرید</div>
            </button>
        </div>
    </div>

    <!-- مدال نقشه -->
    <div class="modal fade" id="mapModal" tabindex="-1" aria-labelledby="mapModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="mapModalLabel">موقعیت روی نقشه</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // متغیرهای global
        let map;
        
        // وقتی مدال باز می‌شود
        const mapModal = document.getElementById('mapModal');
        mapModal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            const locationName = button.getAttribute('data-location');
            const lat = parseFloat(button.getAttribute('data-lat'));
            const lng = parseFloat(button.getAttribute('data-lng'));
            
            // آپدیت عنوان مدال
            document.getElementById('mapModalLabel').textContent = `موقعیت ${locationName}`;
            
            // مقداردهی نقشه
            initializeMap(lat, lng);
        });
        
        // وقتی مدال بسته می‌شود
        mapModal.addEventListener('hidden.bs.modal', function () {
            if (map) {
                map.remove();
                map = null;
            }
        });
        
        // تابع مقداردهی نقشه
        function initializeMap(lat, lng) {
            // ایجاد نقشه
            map = L.map('map').setView([lat, lng], 13);
            
            // اضافه کردن tile layer (نقشه پایه)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);
        }
    </script>
</body>
</html>
